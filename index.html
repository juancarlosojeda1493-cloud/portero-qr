<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Portero Inteligente QR</title>

<style>

body{
    background:#0d1117;
    color:white;
    font-family:Arial;
    text-align:center;
    padding:20px;
    margin:0;
}

.logo-img{
    width:180px;
    margin-top:20px;
    border-radius:20px;
}

.titulo{
    font-size:32px;
    font-weight:bold;
    margin-top:20px;
}

.sub{
    color:#c9d1d9;
    margin-top:10px;
    margin-bottom:40px;
    font-size:18px;
}

.box{
    background:#161b22;
    padding:25px;
    border-radius:20px;
    margin:20px auto;
    max-width:360px;
    box-shadow:0 0 15px rgba(0,0,0,0.4);
}

h2{
    margin-bottom:20px;
}

button{
    width:90%;
    max-width:280px;
    padding:18px;
    margin:10px;
    border:none;
    border-radius:15px;
    background:#238636;
    color:white;
    font-size:22px;
    font-weight:bold;
}

.video{
    background:#1f6feb;
}

button:active{
    transform:scale(0.98);
}

.info{
    margin-top:40px;
    color:#8b949e;
    font-size:14px;
}

.estado{
    margin-top:20px;
    margin-bottom:30px;
    color:#58a6ff;
    font-size:15px;
}

</style>

</head>

<body>

<img src="logo.png" class="logo-img">

<div class="titulo">
PORTERO INTELIGENTE QR
</div>

<div class="sub">
Imprenta Poder Legislativo del Chaco
</div>

<div class="estado">
📍 French Nº 674 • Resistencia - Chaco
</div>

<div id="contenido"></div>

<div class="info">
Audio • Video • Atención institucional
</div>

<script>

const ahora = new Date();

const dia = ahora.getDay();

const hora = ahora.getHours();
const minutos = ahora.getMinutes();

const horaActual = hora + minutos / 60;

const inicio = 13.5;
const fin = 19.5;

const contenido =
document.getElementById("contenido");

const esDiaHabil =
dia >= 1 && dia <= 5;

const dentroHorario =
horaActual >= inicio &&
horaActual <= fin;

if(esDiaHabil && dentroHorario){

contenido.innerHTML = `

<div class="box">

<h2>1° Planta Alta</h2>

<a href="https://wa.me/5493624645875?text=Hola%20estoy%20en%20la%20entrada%20de%20Imprenta%20Poder%20Legislativo%20Chaco">

<button>
📞 Audio
</button>

</a>

<a href="https://wa.me/5493624645875">

<button class="video">
🎥 Video
</button>

</a>

</div>

<div class="box">

<h2>2° Planta Baja</h2>

<a href="https://wa.me/5493624955719?text=Hola%20estoy%20en%20la%20entrada%20de%20Imprenta%20Poder%20Legislativo%20Chaco">

<button>
📞 Audio
</button>

</a>

<a href="https://wa.me/5493624955719">

<button class="video">
🎥 Video
</button>

</a>

</div>

`;

}else{

contenido.innerHTML = `

<div class="box">

<h2>
⏰ Oficina cerrada
</h2>

<p>
Atención:
Lunes a Viernes
13:30 hs a 19:30 hs
</p>

</div>

`;

}

</script>

</body>
</html>
